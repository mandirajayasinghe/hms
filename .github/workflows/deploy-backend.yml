name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "hms-backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hms-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: hms-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (if configured)
        run: npm run lint --if-present

      - name: Run tests (if configured)
        run: npm test --if-present

      - name: Validate Dockerfile builds
        run: docker build -t hms-backend-ci-check .

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.EC2_BACKEND_PATH }}
            git fetch origin main
            git reset --hard origin/main
            docker compose down
            docker compose up -d --build
            echo "Waiting for backend health check..."
            sleep 8
            curl -f http://localhost:5000/health || (echo "Health check failed" && exit 1)
            echo "✅ Backend deployed successfully"